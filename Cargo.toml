[package]
name = "raytrace"
version = "0.1.0"
edition = "2024"
authors = ["Jerome Dolman <jerome@novapsi.net.nz>"]

[profile.release]
debug = true
lto = true

[profile.bench]
debug = true
lto = true

[dependencies]

rand = "0.9"
noise = "0.9"
float-cmp = "0.10"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Keep lib/bin out of `cargo bench` so criterion CLI args aren't passed to libtest
[lib]
bench = false

[[bin]]
name = "raytrace"
path = "src/main.rs"
bench = false

[dev-dependencies]
criterion = "0.8"

# harness = false: criterion supplies main() instead of the built-in libtest harness
[[bench]]
name = "bench_geometry"
harness = false

[[bench]]
name = "bench_materials"
harness = false

[[bench]]
name = "bench_simdgeometry"
harness = false
